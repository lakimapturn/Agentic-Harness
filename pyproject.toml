[project]
name = "agentic-harness"
version = "0.1.0"
description = "Run any benchmark against any agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.1",
    "PyYAML>=6.0",
    "redis>=6,<8",
    "rq>=2.6,<3",
]

[project.optional-dependencies]
mini = ["mini-swe-agent==2.4.6"]
test = ["pytest>=7.0"]

[project.scripts]
harness = "agentic_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

